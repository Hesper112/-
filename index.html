<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的 GitHub 图床</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f3fa;color:#252238}
button,input,select{font:inherit}
.top{background:linear-gradient(135deg,#6d3fd1,#a05de8);color:#fff;padding:24px 18px 28px}
.top-inner{max-width:1100px;margin:auto}
h1{margin:0 0 8px;font-size:26px}
.sub{margin:0;opacity:.9;font-size:14px}
.wrap{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(54,35,90,.08);padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{font-size:13px;font-weight:700}
input[type=text],input[type=password],input[type=url],select{border:1px solid #ddd7e8;border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus{border-color:#8756df;box-shadow:0 0 0 3px rgba(135,86,223,.12)}
.token{flex:1;min-width:220px}
.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:700;background:#eeeaf6;color:#3e3157}
.btn.primary{background:#7445d5;color:#fff}
.btn.danger{background:#ffe9ee;color:#b3294d}
.btn.small{padding:7px 10px;font-size:13px}
.drop{border:2px dashed #c9b9e7;border-radius:16px;padding:30px 16px;text-align:center;background:#fbf9ff;transition:.15s}
.drop.drag{background:#f0e9ff;border-color:#7445d5}
.drop strong{display:block;font-size:18px;margin-bottom:7px}
.drop p{margin:0 0 14px;color:#756b83;font-size:13px}
.hidden{display:none!important}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.section-title h2{font-size:18px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item{border:1px solid #eee9f4;border-radius:14px;overflow:hidden;background:#fff}
.thumb{height:170px;background:#f4f1f8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.meta{padding:12px}
.name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{font-size:12px;color:#817789;margin:5px 0 9px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.status{font-size:12px;margin-top:8px}
.ok{color:#25824c}.err{color:#b3294d}.wait{color:#806d93}
.audio{width:100%}
.progress{height:7px;background:#eee9f4;border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:#7a49d7;transition:.2s}
.empty{padding:35px;text-align:center;color:#8b8192}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#282230;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-size:14px;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(20,14,30,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:40}
.modal-box{background:#fff;border-radius:18px;width:min(900px,100%);max-height:94vh;overflow:auto;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{margin:0}
.crop-stage{position:relative;background:#111;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:300px;max-height:65vh;touch-action:none}
.crop-stage canvas{max-width:100%;max-height:65vh;display:block}
.crop-overlay{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.48);cursor:move;touch-action:none}
.handle{position:absolute;width:18px;height:18px;background:#fff;border:2px solid #6d3fd1;border-radius:50%}
.tl{left:-9px;top:-9px;cursor:nwse-resize}.tr{right:-9px;top:-9px;cursor:nesw-resize}
.bl{left:-9px;bottom:-9px;cursor:nesw-resize}.br{right:-9px;bottom:-9px;cursor:nwse-resize}
.crop-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.crop-info{font-size:12px;color:#776d82;margin-left:auto}
.preview-big{max-width:100%;max-height:70vh;display:block;margin:auto}
.footer{text-align:center;color:#8b8192;font-size:12px;padding:8px 0 30px}
@media(max-width:600px){.top{padding-top:18px}.card{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.thumb{height:125px}.meta{padding:9px}.actions .btn{flex:1}.crop-info{width:100%;margin-left:0}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><h1>📷 我的 GitHub 图床</h1><p class="sub">多图上传 · 预览 · 可选裁剪 · 外链管理</p></div></header>
<main class="wrap">
<section class="card">
  <div class="section-title"><h2>🔐 GitHub Token</h2></div>
  <div class="row">
    <input id="token" class="token" type="password" placeholder="粘贴你的 GitHub Token（不要发给任何人）">
    <button class="btn" id="showToken">显示</button>
    <button class="btn primary" id="saveToken">保存 Token</button>
  </div>
  <div style="font-size:12px;color:#817789;margin-top:8px">Token 只保存在当前浏览器的 localStorage 中。代码里没有写入 Token。</div>
</section>

<section class="card">
  <div class="drop" id="drop">
    <strong>把图片或音频拖到这里</strong>
    <p>也可以点击选择；支持一次选择多个文件</p>
    <button class="btn primary" id="choose">选择文件</button>
    <input id="files" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac">
  </div>
</section>

<section class="card" id="queueCard">
  <div class="section-title">
    <h2>⬆️ 待上传 <span id="queueCount">0</span></h2>
    <div class="row">
      <button class="btn small" id="clearQueue">清空</button>
      <button class="btn primary" id="uploadAll">上传全部</button>
    </div>
  </div>
  <div id="queue" class="grid"></div>
  <div id="queueEmpty" class="empty">还没有选择文件</div>
</section>

<section class="card">
  <div class="section-title">
    <h2>🖼️ 图库</h2>
    <button class="btn small" id="refresh">⟳ 刷新图库</button>
  </div>
  <div id="gallery" class="grid"></div>
  <div id="galleryEmpty" class="empty">点击“刷新图库”加载已上传文件</div>
</section>
<div class="footer">仓库：Hesper112 / 图床 · 分支：main</div>
</main>

<div id="toast" class="toast"></div>

<div id="cropModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3>✂️ 裁剪图片</h3><button class="btn small" id="cropClose">关闭</button></div>
    <div class="crop-stage" id="cropStage"><canvas id="cropCanvas"></canvas><div id="cropBox" class="crop-overlay"><i class="handle tl"></i><i class="handle tr"></i><i class="handle bl"></i><i class="handle br"></i></div></div>
    <div class="crop-controls">
      <label>比例
        <select id="ratio">
          <option value="free">自由裁剪</option><option value="1">1:1</option><option value="1.333333">4:3</option><option value=".75">3:4</option><option value="1.777778">16:9</option><option value=".5625">9:16</option>
        </select>
      </label>
      <button class="btn small" id="cropReset">重置</button>
      <span class="crop-info" id="cropInfo"></span>
      <button class="btn" id="cropCancel">取消</button><button class="btn primary" id="cropConfirm">确认裁剪</button>
    </div>
  </div>
</div>

<div id="previewModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="previewTitle">预览</h3><button class="btn small" id="previewClose">关闭</button></div>
    <img id="previewImg" class="preview-big" alt="">
  </div>
</div>

<script>
/* ===== 只需要修改这里的配置 ===== */
const GITHUB_USERNAME = "Hesper112";
const REPOSITORY_NAME = "图床";
const BRANCH = "main";
/* ================================= */

const API_BASE = `https://api.github.com/repos/${encodeURIComponent(GITHUB_USERNAME)}/${encodeURIComponent(REPOSITORY_NAME)}`;
const RAW_BASE = `https://${GITHUB_USERNAME}.github.io/${encodeURIComponent(REPOSITORY_NAME)}/`;
const IMAGE_EXT = ["jpg","jpeg","png","gif","webp","svg","bmp","ico"];
const AUDIO_EXT = ["mp3","wav","m4a","ogg","flac","aac"];
let queueItems = [];
let galleryFiles = [];
let toastTimer;

const $ = id => document.getElementById(id);
function toast(msg){ clearTimeout(toastTimer); $("toast").textContent=msg; $("toast").classList.add("show"); toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2200); }
function ext(name){ return (name.split(".").pop()||"").toLowerCase(); }
function isImage(name){ return IMAGE_EXT.includes(ext(name)); }
function isGif(name){ return ext(name)==="gif"; }
function isAudio(name){ return AUDIO_EXT.includes(ext(name)); }
function token(){ return localStorage.getItem("github_image_host_token") || ""; }
function headers(){ return {"Accept":"application/vnd.github+json","Authorization":"Bearer "+token(),"X-GitHub-Api-Version":"2022-11-28"}; }
function safeName(name){ return name.replace(/[\/\\:*?"<>|]/g,"_"); }
function makeUniqueName(name, existing){ let base=name, i=1; while(existing.has(base)){ const p=name.lastIndexOf("."); base=p>0?name.slice(0,p)+"_"+i+name.slice(p):name+"_"+i; i++; } existing.add(base); return base; }
function bytes(n){ if(n<1024)return n+" B"; if(n<1048576)return (n/1024).toFixed(1)+" KB"; if(n<1073741824)return (n/1048576).toFixed(1)+" MB"; return (n/1073741824).toFixed(1)+" GB"; }
function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function dataUrlToBlob(data){const [head,b64]=data.split(","); const mime=(head.match(/data:(.*?);/)||[])[1]||"image/png"; const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime});}
async function imageSize(file){return new Promise(resolve=>{const im=new Image(); im.onload=()=>resolve({w:im.naturalWidth,h:im.naturalHeight}); im.onerror=()=>resolve({w:0,h:0}); im.src=URL.createObjectURL(file);});}

$("token").value=token();
$("showToken").onclick=()=>{const x=$("token"); x.type=x.type==="password"?"text":"password"; $("showToken").textContent=x.type==="password"?"显示":"隐藏";};
$("saveToken").onclick=()=>{const t=$("token").value.trim(); if(!t)return toast("请先粘贴 Token"); localStorage.setItem("github_image_host_token",t); toast("Token 保存成功");};

$("choose").onclick=()=>$("files").click();
$("files").onchange=e=>addFiles([...e.target.files]);
["dragenter","dragover"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.add("drag")}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.remove("drag")}));
$("drop").addEventListener("drop",e=>addFiles([...e.dataTransfer.files]));

async function addFiles(files){
  const existing=new Set(queueItems.map(x=>x.name));
  for(const f of files){
    if(!(isImage(f.name)||isAudio(f.name))){toast("不支持的文件："+f.name);continue;}
    const name=makeUniqueName(safeName(f.name),existing);
    const item={id:crypto.randomUUID(),name,file:f,status:"wait",progress:0,cropped:false,dim:null};
    if(isImage(f.name)) item.dim=await imageSize(f);
    queueItems.push(item);
  }
  renderQueue();
}
function renderQueue(){
  $("queueCount").textContent=queueItems.length;
  $("queueEmpty").classList.toggle("hidden",queueItems.length>0);
  $("queue").innerHTML="";
  queueItems.forEach(item=>{
    const el=document.createElement("div"); el.className="item";
    const thumb=document.createElement("div"); thumb.className="thumb";
    if(isImage(item.name)){const im=document.createElement("img"); im.src=URL.createObjectURL(item.file); thumb.appendChild(im);}
    else {const a=document.createElement("audio");a.className="audio";a.controls=true;a.src=URL.createObjectURL(item.file);thumb.appendChild(a);}
    const meta=document.createElement("div");meta.className="meta";
    meta.innerHTML=`<div class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div><div class="dim">${item.dim&&item.dim.w?item.dim.w+" × "+item.dim.h+" · ":""}${bytes(item.file.size)}</div>`;
    const actions=document.createElement("div");actions.className="actions";
    if(isImage(item.name)&&!isGif(item.name)){const b=document.createElement("button");b.className="btn small";b.textContent=item.cropped?"✂️ 重新裁剪":"✂️ 裁剪";b.onclick=()=>openCrop(item);actions.appendChild(b);}
    if(isGif(item.name)){const s=document.createElement("span");s.className="dim";s.textContent="GIF 保持原图";actions.appendChild(s);}
    const del=document.createElement("button");del.className="btn small danger";del.textContent="删除";del.onclick=()=>{queueItems=queueItems.filter(x=>x.id!==item.id);renderQueue();};
    actions.appendChild(del);meta.appendChild(actions);
    const st=document.createElement("div");st.className="status "+(item.status==="ok"?"ok":item.status==="err"?"err":"wait");st.textContent=item.message||"等待上传";meta.appendChild(st);
    if(item.status==="uploading"){const p=document.createElement("div");p.className="progress";p.innerHTML="<i style='width:"+item.progress+"%'></i>";meta.appendChild(p);}
    el.append(thumb,meta);$("queue").appendChild(el);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
$("clearQueue").onclick=()=>{queueItems=[];renderQueue();};

let crop={item:null,img:null,scale:1,x:0,y:0,w:0,h:0,start:null,mode:null};
function openCrop(item){
  crop.item=item; const im=new Image(); im.onload=()=>{crop.img=im; setupCrop(); $("cropModal").classList.remove("hidden");}; im.src=URL.createObjectURL(item.file);
}
function setupCrop(){
  const stage=$("cropStage"), canvas=$("cropCanvas"), im=crop.img;
  const maxW=Math.min(stage.clientWidth-10,850), maxH=Math.min(window.innerHeight*.62,650);
  crop.scale=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight,1);
  canvas.width=Math.round(im.naturalWidth*crop.scale); canvas.height=Math.round(im.naturalHeight*crop.scale);
  const ctx=canvas.getContext("2d");ctx.drawImage(im,0,0,canvas.width,canvas.height);
  const ratio=$("ratio").value; let bw=canvas.width*.75,bh=canvas.height*.75;
  if(ratio!=="free"){const r=+ratio;if(bw/bh>r)bw=bh*r;else bh=bw/r;}
  crop.x=(canvas.width-bw)/2;crop.y=(canvas.height-bh)/2;crop.w=bw;crop.h=bh; drawCropBox(); updateCropInfo();
}
function drawCropBox(){const b=$("cropBox");b.style.left=crop.x+"px";b.style.top=crop.y+"px";b.style.width=crop.w+"px";b.style.height=crop.h+"px";}
function updateCropInfo(){ $("cropInfo").textContent=`裁剪区域约 ${Math.round(crop.w/crop.scale)} × ${Math.round(crop.h/crop.scale)} px`; }
$("ratio").onchange=()=>{if(crop.img)setupCrop();};
$("cropReset").onclick=()=>{if(crop.img)setupCrop();};
$("cropClose").onclick=$("cropCancel").onclick=()=>{$("cropModal").classList.add("hidden");crop.item=null;};
$("cropStage").addEventListener("pointerdown",e=>{
  if(e.target.classList.contains("handle")){crop.mode=e.target.classList[1];}
  else if(e.target.closest("#cropBox")){crop.mode="move";}
  else return;
  e.preventDefault(); const r=$("cropStage").getBoundingClientRect(); crop.start={px:e.clientX-r.left,py:e.clientY-r.top,x:crop.x,y:crop.y,w:crop.w,h:crop.h}; $("cropStage").setPointerCapture(e.pointerId);
});
$("cropStage").addEventListener("pointermove",e=>{
  if(!crop.start||!crop.mode)return; const r=$("cropStage").getBoundingClientRect(); const dx=e.clientX-r.left-crop.start.px,dy=e.clientY-r.top-crop.start.py;
  const min=30, ratio=$("ratio").value;
  if(crop.mode==="move"){crop.x=Math.max(0,Math.min(crop.start.x+dx,$("cropCanvas").width-crop.w));crop.y=Math.max(0,Math.min(crop.start.y+dy,$("cropCanvas").height-crop.h));}
  else {
    let x=crop.start.x,y=crop.start.y,w=crop.start.w,h=crop.start.h;
    if(crop.mode==="br"){w=Math.max(min,x+crop.start.w+dx-x);h=Math.max(min,y+crop.start.h+dy-y);}
    if(crop.mode==="tl"){x=Math.min(crop.start.x+dx,crop.start.x+crop.start.w-min);y=Math.min(crop.start.y+dy,crop.start.y+crop.start.h-min);w=crop.start.x+crop.start.w-x;h=crop.start.y+crop.start.h-y;}
    if(crop.mode==="tr"){y=Math.min(crop.start.y+dy,crop.start.y+crop.start.h-min);w=Math.max(min,crop.start.w+dx);h=crop.start.y+crop.start.h-y;x=crop.start.x;}
    if(crop.mode==="bl"){x=Math.min(crop.start.x+dx,crop.start.x+crop.start.w-min);w=crop.start.x+crop.start.w-x;h=Math.max(min,crop.start.h+dy);y=crop.start.y;}
    if(ratio!=="free"){const rr=+ratio;if(["br","tr"].includes(crop.mode)){h=w/rr;}else{w=h*rr;}
      if(crop.mode==="tl"){x=crop.start.x+crop.start.w-w;y=crop.start.y+crop.start.h-h;}
      if(crop.mode==="tr"){y=crop.start.y+crop.start.h-h;}
      if(crop.mode==="bl"){x=crop.start.x+crop.start.w-w;}
    }
    if(x>=0&&y>=0&&x+w<=$("cropCanvas").width&&y+h<=$("cropCanvas").height&&w>=min&&h>=min){crop.x=x;crop.y=y;crop.w=w;crop.h=h;}
  }
  drawCropBox();updateCropInfo();
});
$("cropStage").addEventListener("pointerup",()=>{crop.start=null;crop.mode=null;});
$("cropConfirm").onclick=async()=>{
  if(!crop.item)return; const c=document.createElement("canvas");c.width=Math.round(crop.w/crop.scale);c.height=Math.round(crop.h/crop.scale);
  c.getContext("2d").drawImage(crop.img,crop.x/crop.scale,crop.y/crop.scale,c.width,c.height,0,0,c.width,c.height);
  const mime=crop.item.file.type==="image/jpeg"?"image/jpeg":(crop.item.file.type||"image/png");
  const blob=await new Promise(r=>c.toBlob(r,mime,.92)); crop.item.file=new File([blob],crop.item.name,{type:mime}); crop.item.cropped=true; crop.item.dim={w:c.width,h:c.height}; crop.item.message="已裁剪，等待上传"; crop.item.status="wait";
  $("cropModal").classList.add("hidden");renderQueue();toast("图片裁剪成功");
};

async function uploadAll(){
  if(!token())return toast("请先保存 GitHub Token");
  if(!queueItems.length)return toast("请先选择文件");
  const names=await getExistingNames(); const occupied=new Set(names);
  for(const item of queueItems.filter(x=>x.status!=="ok")){
    item.name=makeUniqueName(item.name,occupied); item.status="uploading";item.progress=10;item.message="正在上传…";renderQueue();
    try{
      const buf=await item.file.arrayBuffer();const bytesArr=new Uint8Array(buf);let binary="";const chunk=0x8000;
      for(let i=0;i<bytesArr.length;i+=chunk)binary+=String.fromCharCode(...bytesArr.subarray(i,i+chunk));
      const content=btoa(binary);
      const res=await fetch(`${API_BASE}/contents/${encodeURIComponent(item.name)}`,{method:"PUT",headers:headers(),body:JSON.stringify({message:`upload ${item.name}`,content,branch:BRANCH})});
      if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.message||`HTTP ${res.status}`);}
      item.status="ok";item.progress=100;item.message="上传成功";toast("上传成功："+item.name);
    }catch(e){item.status="err";item.message="上传失败："+e.message;toast("上传失败："+item.name);}
    renderQueue();
  }
  await loadGallery();
}
async function getExistingNames(){
  const res=await fetch(`${API_BASE}/contents?ref=${encodeURIComponent(BRANCH)}`,{headers:headers()});
  if(!res.ok){if(res.status===404)return [];throw new Error("读取仓库失败："+res.status);}
  const data=await res.json();return Array.isArray(data)?data.map(x=>x.name):[];
}
$("uploadAll").onclick=uploadAll;

async function loadGallery(){
  if(!token())return toast("请先保存 GitHub Token");
  $("galleryEmpty").textContent="正在加载…";$("galleryEmpty").classList.remove("hidden");
  try{
    const res=await fetch(`${API_BASE}/contents?ref=${encodeURIComponent(BRANCH)}`,{headers:headers()});
    if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.message||`HTTP ${res.status}`);}
    const data=await res.json();galleryFiles=Array.isArray(data)?data.filter(x=>x.type==="file"&&(isImage(x.name)||isAudio(x.name))):[];
    renderGallery();
    toast("图库刷新成功");
  }catch(e){$("galleryEmpty").textContent="加载失败："+e.message;toast("图库加载失败");}
}
function renderGallery(){
  $("gallery").innerHTML="";
  $("galleryEmpty").classList.toggle("hidden",galleryFiles.length>0);
  if(!galleryFiles.length){$("galleryEmpty").textContent="还没有图片或音频";return;}
  galleryFiles.forEach(f=>{
    const el=document.createElement("div");el.className="item";const th=document.createElement("div");th.className="thumb";
    const url=RAW_BASE+encodeURIComponent(f.name);
    if(isImage(f.name)){const im=document.createElement("img");im.src=url;im.alt=f.name;im.style.cursor="pointer";im.onclick=()=>openPreview(f.name,url);th.appendChild(im);}
    else{const a=document.createElement("audio");a.className="audio";a.controls=true;a.src=url;th.appendChild(a);}
    const meta=document.createElement("div");meta.className="meta";meta.innerHTML=`<div class="name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div><div class="dim">${bytes(f.size||0)}</div>`;
    const link=document.createElement("input");link.type="url";link.value=url;link.readOnly=true;link.style.width="100%";link.style.marginBottom="7px";
    const actions=document.createElement("div");actions.className="actions";
    const cp=document.createElement("button");cp.className="btn small";cp.textContent="复制";cp.onclick=async()=>{await navigator.clipboard.writeText(url);toast("链接已复制");};
    const op=document.createElement("button");op.className="btn small";op.textContent="打开";op.onclick=()=>window.open(url,"_blank");
    const de=document.createElement("button");de.className="btn small danger";de.textContent="删除";de.onclick=()=>deleteFile(f);
    actions.append(cp,op,de);meta.append(link,actions);el.append(th,meta);$("gallery").appendChild(el);
  });
}
async function deleteFile(f){
  if(!confirm(`确定要删除 ${f.name} 吗？`))return;
  try{
    const res=await fetch(`${API_BASE}/contents/${encodeURIComponent(f.name)}`,{method:"DELETE",headers:headers(),body:JSON.stringify({message:`delete ${f.name}`,sha:f.sha,branch:BRANCH})});
    if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.message||`HTTP ${res.status}`);}
    toast("文件删除成功");await loadGallery();
  }catch(e){toast("删除失败："+e.message);}
}
function openPreview(name,url){$("previewTitle").textContent=name;$("previewImg").src=url;$("previewModal").classList.remove("hidden");}
$("previewClose").onclick=()=>$("previewModal").classList.add("hidden");
$("refresh").onclick=loadGallery;
</script>
</body>
